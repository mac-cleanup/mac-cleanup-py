[tox]
minversion = 4.67.0
envlist = py311, py312, py313, py314, py315, pyright, ruff, black, isort, docformatter
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, docformatter
    3.15: py315, pyright, ruff, black, isort

[testenv]
basepython =
    py311: python3.11
    py312: python3.12
    py314, docformatter: python3.14
    py315, pyright, ruff, black, isort: python3.15
setenv =
    PYTHONPATH = {toxinidir}
    py311, py312, py313, py314, py315: GROUP = main,test
    pyright, ruff: GROUP = main,test
    black, isort, docformatter: GROUP = lint
skip_install = true
allowlist_externals = poetry
deps =
    poetry
commands_pre =
    poetry install --only "{env:GROUP}" --no-root -v
commands =
    py311, py312, py313, py314, py315: poetry run pytest
    pyright: poetry run pyright
    ruff: poetry run ruff check .
    black: poetry run black . --check
    isort: poetry run isort . -c
    docformatter: poetry run docformatter -cr . --config ./pyproject.toml
